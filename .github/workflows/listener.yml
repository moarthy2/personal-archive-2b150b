name: sync-worker

on:
  workflow_dispatch:

concurrency:
  group: sync-worker-singleton
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -q --disable-pip-version-check -r bot/requirements.txt

      - name: Run worker
        env:
          PYTHONUNBUFFERED: "1"
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          POLL_SECONDS: "0.45"
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_ENC: ${{ secrets.TG_SESSION_ENC }}
          TG_SESSION_KEY: ${{ secrets.TG_SESSION_KEY }}
          TG_CONTENT_KEY: ${{ secrets.TG_CONTENT_KEY }}
        run: python -m bot.listener